<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>承瀚的多益精選單字卡</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { margin: 0; font-size: 24px; color: #bb86fc; }
        .header p { margin: 5px 0 0 0; color: #888; font-size: 14px; }
        .card-container {
            width: 100%;
            max-width: 340px;
            height: 400px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .card-front {
            background-color: #1e1e1e;
            border: 2px solid #333;
            align-items: center;
        }
        .card-front h2 {
            font-size: 32px;
            margin: 0;
            color: #03dac6;
            text-align: center;
        }
        .card-front .hint {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        .card-back {
            background-color: #252525;
            border: 2px solid #bb86fc;
            transform: rotateY(180deg);
        }
        .phonetic { color: #bb86fc; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .meaning { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #fff; }
        .collocation, .example { font-size: 14px; color: #aaa; line-height: 1.5; margin-bottom: 10px; }
        .highlight { color: #ffb74d; }
        .nav-buttons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 340px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:active { background-color: #444; }
        #next-btn { background-color: #bb86fc; color: #121212; }
        #next-btn:active { background-color: #9965cc; }
    </style>
</head>
<body>

    <div class="header">
        <h1>多益 600 核心字卡</h1>
        <p id="progress">卡片：1 / 7</p>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <h2 id="word-front">personnel</h2>
                <div class="hint">💡 點擊翻看釋義</div>
            </div>
            <div class="card-face card-back">
                <div class="phonetic" id="word-audio">[ˌpɜːrsəˈnel]</div>
                <div class="meaning" id="word-meaning">全體人員、員工</div>
                <div class="collocation" id="word-collo"><b>💡 職場搭配：</b><br>security personnel (安全人員)</div>
                <div class="example" id="word-ex"><b>⚠️ 多益大陷阱：</b><br><span class="highlight">本身即為複數，字尾絕不加 s！</span></div>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <button onclick="prevCard()">上一張</button>
        <button id="next-btn" onclick="nextCard()">下一張</button>
    </div>

    <script>
        const cardsData = [
            { word: "personnel", phonetic: "[ˌpɜːrsəˈnel]", meaning: "全體人員、員工", collo: "security personnel (安全人員) / HR personnel (人資人員)", ex: "⚠️ 多益大陷阱：本身即為複數，字尾絕不加 s！" },
            { word: "interest rates", phonetic: "[ˈɪntrəst reɪts]", meaning: "利率", collo: "raise interest rates (調升利率)", ex: "📖 變動將會影響借貸成本。" },
            { word: "mortgage rates", phonetic: "[ˈmɔːrɡɪdʒ reɪts]", meaning: "房貸利率、抵押貸款利率", collo: "fixed mortgage rates (固定房貸利率)", ex: "📖 銀行為首次購屋者提供具競爭力的房貸利率。" },
            { word: "estimate", phonetic: "[ˈestɪmət]", meaning: "估價單；預估值", collo: "provide a cost estimate (提供成本估價單)", ex: "📖 承包商為我們的辦公室整修提供了粗略估價。" },
            { word: "contract", phonetic: "[ˈkɑːntrækt]", meaning: "合約、契約", collo: "sign a contract (簽訂合約)", ex: "📖 請在簽署前仔細審閱合約條款。" },
            { word: "supervisor", phonetic: "[ˈsuːpərvaɪzər]", meaning: "主管、督導", collo: "direct supervisor (直屬主管)", ex: "📖 加班申請都必須經由你的主管批准。" },
            { word: "capitals", phonetic: "[ˈkæpɪtlz]", meaning: "資本、資金；大寫字母", collo: "raise capital (籌措資金)", ex: "📖 公司需要更多資金來擴建其製造工廠。" }
        ];

        let currentIndex = 0;
        const cardEl = document.getElementById('card');

        function flipCard() { cardEl.classList.toggle('flipped'); }

        function updateCard() {
            cardEl.classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('word-front').innerText = cardsData[currentIndex].word;
                document.getElementById('word-audio').innerText = cardsData[currentIndex].phonetic;
                document.getElementById('word-meaning').innerText = cardsData[currentIndex].meaning;
                document.getElementById('word-collo').innerHTML = `<b>💡 職場搭配：</b><br>${cardsData[currentIndex].collo}`;
                document.getElementById('word-ex').innerHTML = `${cardsData[currentIndex].ex}`;
                document.getElementById('progress').innerText = `卡片：${currentIndex + 1} / ${cardsData.length}`;
            }, 150);
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCard();
        }
    </script>
</body>
</html>
